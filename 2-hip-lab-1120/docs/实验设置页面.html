<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stem-lab 实验设置页面（设计稿）</title>
<style>
:root { color-scheme: light dark; --bg:#f6f5f1; --card:#fff; --line:#d9d6cc; --text:#1f1e1b; --soft:#6b6960; --accent:#1f5fa8; --tint:#eaf1fa; --warn:#8a5a00; --warnbg:#fbf1dc; --bad:#a32d2d; }
@media (prefers-color-scheme: dark) { :root { --bg:#1b1b19; --card:#252522; --line:#3d3c38; --text:#ecebe6; --soft:#a3a096; --accent:#8bb8ee; --tint:#22303f; --warn:#f0c26a; --warnbg:#3a2f17; --bad:#f09595; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, "Microsoft YaHei", sans-serif; }
header { padding: 14px 20px 10px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.soft, .hint { color: var(--soft); }
.hint { font-size: 12px; display: block; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; }
.flow button { border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.wrap { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 18px; padding: 16px 20px 60px; max-width: 1280px; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
nav h3 { margin: 12px 0 4px; font-size: 12px; font-weight: 600; color: var(--soft); }
nav button { display: block; width: 100%; text-align: left; margin: 2px 0; border: 1px solid transparent; background: none; }
nav button.on { background: var(--tint); border-color: var(--line); color: var(--accent); }
button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.x { padding: 2px 8px; color: var(--soft); }
h2 { margin: 0 0 2px; font-size: 18px; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 12px 0; }
.card > h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.card h4 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; }
.tag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--soft); margin-left: 6px; vertical-align: 1px; }
.note { background: var(--warnbg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 10px 0; font-size: 13px; }
.note ul { margin: 0; padding-left: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 14px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
label.f { display: block; }
label.f .l { display: block; font-size: 12px; color: var(--soft); margin-bottom: 2px; }
label.f .l i { font-style: normal; opacity: .8; }
input[type=text], select { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
input.bad { border-color: var(--bad); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { font-size: 12px; font-weight: 500; color: var(--soft); text-align: left; padding: 2px 4px; white-space: nowrap; vertical-align: bottom; }
th small { display: block; font-weight: 400; opacity: .8; }
td { padding: 2px 3px; }
td input[type=text] { min-width: 74px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.checks label { font-size: 13px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); font-size: 13px; }
pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
@media (prefers-color-scheme: dark) { .primary { color: #10202f; } }
</style>
</head>
<body>
<header>
  <h1>stem-lab 实验设置页面 <span class="tag">设计稿，不写账本</span></h1>
  <div class="soft">八种实验各一页。每一项的名字、单位、默认值和范围都取自内核包的清单和各插件的检查代码；每张表下面能看到“保存时登记的内容”。账上现在登记的东西是 0，所以下拉里的名字都是示例。</div>
  <div class="flow" id="flow"></div>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
"use strict";
// ---------------------------------------------------------------- 取自内核包 M1-3406-v1 的清单、推导量定义 bed_f、旧系统 v1 盒子
const DESIGN = [
  ["L", "柄长", "mm", 20, 45, 43.0612, "肩部到尖端"],
  ["alpha", "柄轴角 α", "°", 15, 45, 44.3537, "颈平面内柄轴和干轴的夹角"],
  ["h_cut", "截骨高度", "mm", 16, 32, 16, "截骨面到头心的距离，沿颈轴"],
  ["m", "皮质余量 m", "mm", 0.5, 2.0, 0.5, "柄面到内膜面至少留这么多"],
  ["rho_tip", "尖端面积比", "", 0.10, 0.50, 0.2117, "尖端和肩部的截面积之比"],
  ["q", "面积递减指数", "", 0.5, 3.0, 2.9987, "面积沿柄递减的指数"],
  ["lam", "宽厚比", "", 1.0, 2.2, 1.1186, "截面内外宽和前后厚之比"],
  ["g_ml", "内侧占宽比", "", 0.35, 0.65, 0.5421, "内侧占宽度的比例"],
  ["g_ap", "前方占厚比", "", 0.35, 0.65, 0.4620, "前方占厚度的比例"],
  ["n_a", "前半超椭圆指数", "", 2, 6, 4.5577, "前半截面的超椭圆指数"],
  ["n_p", "后半超椭圆指数", "", 2, 6, 2.8643, "后半截面的超椭圆指数"],
  ["tau_a", "前半楔形斜度", "", -0.30, 0.30, -0.3, "前半的楔形斜度"],
  ["tau_p", "后半楔形斜度", "", -0.30, 0.30, -0.2483, "后半的楔形斜度"],
].map(([name, label, unit, min, max, a, help]) => ({ name, label, unit, min, max, a, help }));
const CONDITIONS = [
  ["load_N", "头上的合力", "N", 2391, "上楼梯 2391 N，约 3 倍体重"],
  ["load_front_deg", "冠状面倾角", "°", 20, "合力在冠状面里的倾角"],
  ["load_sagit_deg", "矢状面倾角", "°", 18, "合力在矢状面里的倾角"],
  ["delta_mm", "松质过盈 δ", "mm", 0.10, "松质界面的径向过盈"],
  ["mu", "摩擦系数 μ", "", 0.3, ""],
  ["E_canc_MPa", "松质（泡沫）模量", "MPa", 155, ""],
  ["cycles", "加载循环数", "", 2, "基线 2，旧系统的变体用过 4 和 10"],
  ["h_int_mm", "界面网格尺寸", "mm", 2.0, ""],
].map(([name, label, unit, def, help]) => ({ name, label, unit, def, help }));
const LOADS = { stairs: ["上楼梯：2391 N，20°，18°", 2391, 20, 18], sit: ["坐起：1714 N，24°，8°", 1714, 24, 8], own: ["自己填", null, null, null] };
const LABELS = [["rot_first_deg", "首次加载柄相对骨的转动 (°)"], ["rot_rev_deg", "第二循环可恢复的转动 (°)"], ["rot_perm_deg", "卸载后残留的转动 (°)"],
  ["subsid_first_um", "首次加载沿柄轴的下沉 (μm)"], ["f1_p95_um", "第二循环可恢复切向微动 95 分位 (μm)"], ["f1_first_p95_um", "首次加载切向相对位移 95 分位 (μm)"],
  ["contact_area_load2_mm2", "第二次加载时闭合的界面面积 (mm²)"], ["open_frac_load2", "第二次加载时张开的界面面积比例"], ["area_frac_gt150", "微动超过 150 μm 的界面面积比例"]];
const PRE = [["bone_total_mm3", "去骨量：截掉的加锉掉的 (mm³)"], ["bone_resected_mm3", "截掉的骨 (mm³)"], ["bone_reamed_mm3", "锉掉的骨 (mm³)"],
  ["A0_mm2", "模板化选出的肩部面积 (mm²)"], ["e_mm", "实际用的入口偏移 (mm)"], ["alpha_placed_deg", "放置后的柄轴角 (°)"], ["contact_templated", "模板化时的贴合比例"]];
const DERIVED = [["F_mm", "床支撑 F (mm)"], ["F_area_mm2", "支撑区内的界面面积 (mm²)"], ["F_t_min_mm", "支撑区内最薄的泡沫厚度 (mm)"], ["F_frac_floor", "支撑区内厚度小于下限的面积占比"]];
const SCALARS = [...LABELS, ...PRE, ...DERIVED];
const MEASURED = ["cortical_watertight", "cancellous_watertight", "head_fit_rms_mm", "neck_wall_min_mm", "neck_shaft_angle_deg", "cortical_volume_change",
  "landmark_shift_max_mm", "kernel_smoke", "head_radius_mm", "neck_isthmus_area_mm2", "neck_isthmus_from_head_mm", "lesser_trochanter_below_head_mm",
  "lesser_trochanter_prominence_mm", "cortical_mesh_quality_min", "cancellous_mesh_quality_min",
  // 下面这些只有 CT 重建出来的骨才量
  "surfaces_open_edges", "remesh_deviation_p95_mm", "wall_min_mm", "tet_gamma_min", "tet_inverted", "outer_vs_reference_p95_mm",
  "cortical_mesh_volume_error", "cancellous_mesh_volume_error", "surface_on_bone_share", "cortex_added_by_rules_share", "interface_gap_max_mm"];
const GATE = [
  { name: "cortical_closed", value: "cortical_watertight", equals: "true", what: "皮质实体的表面封闭" },
  { name: "cancellous_closed", value: "cancellous_watertight", equals: "true", what: "松质实体的表面封闭" },
  { name: "head_fit", value: "head_fit_rms_mm", max: "1.0", what: "股骨头球拟合的残差不超过 1 mm" },
  { name: "neck_wall", value: "neck_wall_min_mm", min: "0.3", what: "股骨颈处皮质最薄不小于 0.3 mm" },
  { name: "neck_shaft_angle", value: "neck_shaft_angle_deg", min: "110", max: "145", what: "颈干角在成人的范围里" },
];
const FINAL_GATE = [
  { name: "volume_kept", value: "cortical_volume_change", max: "0.005", what: "皮质实体的体积和候选时相差不超过 0.5%" },
  { name: "landmarks_near", value: "landmark_shift_max_mm", max: "5.0", what: "定稿的标志点离自动找的不超过 5 mm" },
  { name: "kernel_fits", value: "kernel_smoke", equals: "true", what: "内核在这根骨上模板化得了基线设计" },
];
// CT 重建出来的骨另加的四条线：2026-11 第二版 CT 流程的合格标准
const CT_GATE = [
  { name: "closed", value: "surfaces_open_edges", max: "0", what: "外表面和内壁都封闭" },
  { name: "remesh_close", value: "remesh_deviation_p95_mm", max: "0.3", what: "重划之后离原来的表面不超过 0.3 mm（95% 分位）" },
  { name: "tets_fit", value: "tet_gamma_min", min: "0.1", what: "试划成四面体后，最差的单元质量 gamma 不低于 0.1" },
  { name: "tets_upright", value: "tet_inverted", max: "0", what: "没有翻转的四面体" },
];
const CT_CAP = [[0, 3], [0.1, 3], [0.22, 60], [0.72, 60], [0.85, 5], [1, 5]];      // 两端限深：[沿骨长的位置（0 远端，1 近端）, 上限毫米]
const FRAMES = {
  cad: { origin: "the origin of the CAD files", x: "medial", y: "posterior", z: "proximal" },
  ct: { origin: "the origin of the CT scan (scanner coordinates, LPS)", x: "patient left", y: "patient posterior", z: "patient superior" },
};
const BONE = "sawbone3406";

// ---------------------------------------------------------------- 小工具
const h = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, "");
    else if (value !== false && value !== null && value !== undefined) node.setAttribute(key, value);
  }
  kids.flat(3).forEach((kid) => { if (kid !== null && kid !== undefined && kid !== "") node.append(kid instanceof Node ? kid : document.createTextNode(String(kid))); });
  return node;
};
const copy = (value) => JSON.parse(JSON.stringify(value));
const num = (value) => { const text = String(value ?? "").trim(); if (text === "") return undefined; const n = Number(text); return Number.isFinite(n) ? n : null; };
const put = (out, key, value) => { if (value !== undefined) out[key] = value; return out; };
let changed = () => {};

function text(model, key, label, opts = {}) {
  const input = h("input", { type: "text", value: model[key] ?? "", placeholder: opts.ph || "" });
  const bad = () => input.classList.toggle("bad", !opts.optional && !input.value.trim() || Boolean(opts.pattern && input.value && !opts.pattern.test(input.value)));
  input.addEventListener("input", () => { model[key] = input.value; bad(); changed(); });
  bad();
  return h("label", { class: "f" }, h("span", { class: "l" }, label, opts.optional ? "（可不填）" : ""), input, opts.help ? h("span", { class: "hint" }, opts.help) : "");
}
function number(model, key, label, opts = {}) {
  const input = h("input", { type: "text", inputmode: "decimal", value: model[key] ?? "" });
  const bad = () => {
    const n = num(input.value);
    input.classList.toggle("bad", n === undefined ? !opts.optional : n === null || (opts.min !== undefined && n < opts.min) || (opts.max !== undefined && n > opts.max) || Boolean(opts.int && !Number.isInteger(n)));
  };
  input.addEventListener("input", () => { model[key] = input.value; bad(); changed(); });
  bad();
  const range = opts.min !== undefined || opts.max !== undefined ? `范围 ${opts.min ?? "…"} 到 ${opts.max ?? "…"}` : "";
  const help = [opts.help, range, opts.def !== undefined ? `默认 ${opts.def}` : ""].filter(Boolean).join("；");
  return h("label", { class: "f" }, h("span", { class: "l" }, label, opts.unit ? h("i", {}, `（${opts.unit}）`) : "", opts.optional ? "（可不填）" : ""), input, help ? h("span", { class: "hint" }, help) : "");
}
function choice(model, key, label, options, opts = {}) {
  const select = h("select", {}, options.map(([value, shown]) => h("option", { value, selected: String(model[key]) === String(value) }, shown ?? value)));
  select.addEventListener("change", () => { model[key] = select.value; if (opts.redraw) opts.redraw(); changed(); });
  return h("label", { class: "f" }, h("span", { class: "l" }, label), select, opts.help ? h("span", { class: "hint" }, opts.help) : "");
}
function rows(list, cols, make, more = "＋ 加一行") {
  const box = h("div");
  const draw = () => {
    const table = h("table", {}, h("tr", {}, cols.map((col) => h("th", { style: col.w ? `min-width:${col.w}px` : null }, col.label, col.sub ? h("small", {}, col.sub) : "")), h("th")));
    list.forEach((row, index) => {
      const line = h("tr");
      cols.forEach((col) => {
        const cell = col.options
          ? h("select", {}, col.options.map(([value, shown]) => h("option", { value, selected: String(row[col.k] ?? "") === String(value) }, shown ?? value)))
          : h("input", { type: "text", value: row[col.k] ?? "", placeholder: col.ph || "" });
        if (col.pattern) cell.classList.toggle("bad", !col.pattern.test(cell.value));
        cell.addEventListener(col.options ? "change" : "input", () => { row[col.k] = cell.value; if (col.pattern) cell.classList.toggle("bad", !col.pattern.test(cell.value)); changed(); });
        line.append(h("td", {}, cell));
      });
      line.append(h("td", {}, h("button", { class: "x", title: "删掉这一行", onclick: () => { list.splice(index, 1); draw(); changed(); } }, "×")));
      table.append(line);
    });
    box.replaceChildren(h("div", { class: "scroll" }, table), h("div", { class: "bar" }, h("button", { onclick: () => { list.push(make()); draw(); changed(); } }, more)));
  };
  draw();
  return box;
}
function pick(label, kind, from, examples, optional = false) {
  return h("label", { class: "f" }, h("span", { class: "l" }, label, h("i", {}, `　种类：${kind}`), optional ? "（可不填）" : ""),
    h("select", {}, optional ? h("option", {}, "不填") : "", examples.map((name) => h("option", {}, name + "（示例）"))),
    h("span", { class: "hint" }, "从哪来：" + from));
}

// ---------------------------------------------------------------- 各张表：init 给默认值，draw 画出来，build 给出保存时登记的内容
const A_DESIGN = Object.fromEntries([...DESIGN.map((item) => [item.name, item.a]), ["e", "rule"]]);
const COND_DEFAULT = Object.fromEntries(CONDITIONS.map((item) => [item.name, item.def]));
const condModel = () => ({ preset: "stairs", ...Object.fromEntries(CONDITIONS.map((item) => [item.name, String(item.def)])) });
function condFields(model, redraw) {
  const preset = choice(model, "preset", "载荷取哪一种", Object.entries(LOADS).map(([key, value]) => [key, value[0]]), { redraw: () => {
    const [, force, front, sagit] = LOADS[model.preset];
    if (force !== null) { model.load_N = String(force); model.load_front_deg = String(front); model.load_sagit_deg = String(sagit); }
    redraw();
  } });
  return h("div", { class: "grid" }, preset, CONDITIONS.map((item) => number(model, item.name, item.label, { unit: item.unit, help: item.help, def: item.def, int: item.name === "cycles" })));
}
const condBuild = (model) => Object.fromEntries(CONDITIONS.map((item) => [item.name, num(model[item.name]) ?? null]));

const gateCols = [
  { k: "name", label: "检查叫什么", sub: "小写字母、数字、下划线", w: 130, pattern: /^[a-z][a-z0-9_]{0,39}$/ },
  { k: "value", label: "拿哪个量来比", w: 190, options: MEASURED.map((name) => [name, name]) },
  { k: "min", label: "不小于", w: 70 }, { k: "max", label: "不大于", w: 70 },
  { k: "equals", label: "正好是", w: 70, options: [["", "—"], ["true", "是"], ["false", "否"]] },
  { k: "what", label: "这条线是什么意思", w: 260 },
];
const gateBuild = (line) => {
  const out = { name: line.name, value: line.value };
  put(out, "min", num(line.min)); put(out, "max", num(line.max));
  if (line.equals === "true" || line.equals === "false") out.equals = line.equals === "true";
  out.what = line.what || "";
  return out;
};
// 骨源是 CT 时多出来的几项。定稿那一页只留和“定稿时怎么量”有关的两项
function ctFields(m, final) {
  const mesh = [
    number(m, "edge", "外表面重划的目标边长", { unit: "mm", min: 0.5, max: 10, def: 2.5, help: final ? "定稿时照这个边长试划四面体" : "越小，表面的三角形越多" }),
    final ? "" : number(m, "inner", "内壁的边长是外表面的几倍", { min: 0.3, max: 1.5, def: 0.8, help: "内壁更不规则，所以划得更密" }),
    choice(m, "tet", "试划一次四面体，量单元质量", [["yes", "做（约一分钟）"], ["no", "不做"]],
      { help: "划出来的网格不留，只留量出来的数。检查门里拿 tet_gamma_min、tet_inverted 来比的线要它" }),
  ];
  if (final) return [h("h4", {}, "CT 重建出来的两个实体：定稿时怎么量"), h("div", { class: "grid" }, mesh)];
  return [
    h("h4", {}, "怎么从 CT 里分出皮质"),
    h("div", { class: "grid" },
      number(m, "hu", "皮质的 CT 值下限", { unit: "HU", def: 500, help: "外形以内、CT 值不低于它的体素算皮质" }),
      number(m, "voxel", "重采样的体素边长", { unit: "mm", min: 0.2, max: 2, def: 0.7 }),
      number(m, "wallvox", "最小壁厚", { unit: "个体素", min: 1, max: 10, int: true, def: 2, help: "皮质处处至少这么厚。2 个 0.7 mm 的体素就是 1.4 mm" }),
      choice(m, "cap", "两端限深", [["standard", "髁部 3 mm、头颈部 5 mm，骨干不限"], ["none", "不限深"]],
        { help: "离外表面比这更深的不算皮质。两端的松质里有够得上阈值的骨小梁，不限深会被当成皮质" }),
      choice(m, "proximal", "近端（股骨头）在哪一头", [["auto", "照外形自动判断"], ["high_z", "z 大的一头"], ["low_z", "z 小的一头"]])),
    h("h4", {}, "两个表面怎么变成划得了网格的实体"), h("div", { class: "grid" }, mesh),
    h("details", {}, h("summary", {}, "少动的几项"), h("div", { class: "grid", style: "margin-top:8px" },

  flow.append(h("button", { onclick: () => show(page) }, page.title.split("（")[0].split("，")[0]), index < order.length - 1 ? h("span", { class: "soft" }, "→") : ""); });
// 给核对用：每一页每张表照默认值保存时会登记成什么
window.stemlabDefaults = () => Object.fromEntries(PAGES.map((page) => [page.type, Object.fromEntries(page.parts.filter((part) => !part.pick).map((form) => [form.input, form.build(form.init())]))]));
// 骨源选成 CT 时，重建两页的设定照默认值保存会登记成什么
window.stemlabCt = () => ({ draft: reconSetting(false).build(reconSetting(false).init("ct")), final: reconSetting(true).build(reconSetting(true).init("ct")) });
show(current);
</script>
</body>
</html>
