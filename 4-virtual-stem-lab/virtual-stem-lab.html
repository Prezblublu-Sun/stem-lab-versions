<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>virtual-stem-lab</title>
<style>
:root{--ink:#1f2933;--mut:#6b7280;--line:#d9dde3;--bg:#f5f6f8;--nav:#22384d;--blue:#2367c7;--ok:#17803d;--bad:#c0392b;--warn:#b9770e}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--nav);color:#fff;padding:8px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:16px;margin-right:6px}
header a{color:#cfd8e3;text-decoration:none}header a.here{color:#fff;border-bottom:2px solid #fff}
.clock{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.clock button{font:inherit;font-size:12px;padding:1px 7px;border:1px solid #6f8296;background:transparent;color:#cfd8e3;border-radius:4px;cursor:pointer}
.clock button.on{background:#fff;color:var(--nav)}
#fake{background:#fff7e0;border-bottom:1px solid #ecd9a0;padding:4px 16px;font-size:13px;color:#7a5a00}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;max-width:1420px;margin:0 auto;padding:6px 16px 70px}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}}
h1{font-size:22px;margin:12px 0 6px}h2{font-size:17px;margin:22px 0 6px;border-bottom:1px solid var(--line);padding-bottom:2px}h3{font-size:15px;margin:12px 0 4px}
a{color:var(--blue)}
table{border-collapse:collapse;background:#fff;margin:6px 0;max-width:100%}
td,th{border:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
th{background:#eef0f3;font-weight:normal;color:#555;white-space:nowrap}
.mut{color:var(--mut);font-size:12.5px}.ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}.warn{color:var(--warn);font-weight:bold}.run{color:var(--blue);font-weight:bold}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin:8px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.note{background:#eaf4ff;border:1px solid #b6d4f2;padding:6px 12px;border-radius:6px;margin:8px 0}
.err{background:#fdecea;border:1px solid #e6a5a0;padding:6px 12px;border-radius:6px;margin:8px 0}
.todo{background:#fff4e0;border:1px solid #edc98a;padding:6px 12px;border-radius:6px;margin:6px 0}
button,input,select,textarea{font:inherit}
button{padding:3px 12px;cursor:pointer}button.go{font-size:16px;padding:6px 20px;background:var(--blue);color:#fff;border:0;border-radius:5px}
.chip{display:inline-block;padding:4px 13px;margin:3px 6px 3px 0;border:1px solid var(--blue);border-radius:6px;text-decoration:none;background:#fff}
.chip.on{background:var(--blue);color:#fff}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.step{border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;min-width:108px}
.step.done{border-color:#a8d5b5;background:#f0f9f2}.step.now{border-color:var(--blue);box-shadow:0 0 0 2px #cfe0f7}.step.skip{opacity:.45;text-decoration:line-through}
.step small{display:block;color:var(--mut)}
.bar{display:inline-block;width:150px;height:9px;background:#dde;border-radius:5px;vertical-align:middle}.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}
fieldset{border:1px solid #ccc;border-radius:6px;margin:10px 0;background:#fff}legend{font-weight:bold;padding:0 4px}
figure{display:inline-block;margin:6px 10px 6px 0;background:#fff;border:1px solid var(--line);padding:4px}figure svg{max-width:100%;height:auto}
aside{font-size:13.5px}aside .card{position:sticky;top:52px;max-height:calc(100vh - 64px);overflow:auto}
aside li{margin:5px 0}aside ul{padding-left:0;list-style:none}
aside textarea{width:100%;height:76px}aside input[type=text]{width:100%}
.rej{color:var(--bad)}
pre{background:#23272e;color:#e8e8e8;padding:8px;overflow:auto;max-height:240px;font-size:12px;white-space:pre-wrap;margin:6px 0}
</style>
</head>
<body>
<header><b>virtual-stem-lab</b><nav id="nav"></nav><div class="clock"><span id="now"></span><span id="speeds"></span></div></header>
<div id="fake">这是虚拟的：不连任何机器，不跑任何计算，数都是编的。它只用来试“怎么操作”。你在这里做的一切只存在这个浏览器里。</div>
<div class="wrap"><main id="view"></main><aside id="side"></aside></div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   一、设计表。页面上有哪些机器、哪些包、每个包怎么走、每一屏上我先取了什么，全在这一段。
       要改设计，改这一段就行；下面的引擎和页面不用动。
   ════════════════════════════════════════════════════════════════════ */
const SLOTS = 3;                       // 本机求解的槽数
const KINDS = ['重建', 'FEA', '代理', '优化'];
const MACHINES = {
  linux: { name: 'Linux 建模机', about: '前处理（gmsh）、后处理、喂料、代理训练；没有 Abaqus', facts: ['根分区剩 145 GB', 'GPU：RTX 5060 Ti'],
    parts: { serve: { name: 'serve', yes: '在跑', no: '没在跑', about: '给每一行做前处理和后处理。这里没有重启它的按钮。' },
             nvme: { name: 'NVMe 盘', yes: '已挂上', no: '没挂上', about: '场网络的训练数据在上面。机器重启后不会自己挂上，要你挂。', on: '挂上 NVMe', off: '卸下' } } },
  win: { name: '本机 Windows', about: 'Abaqus 2025 求解，3 个槽，每槽 5 核，许可在本机', facts: ['H: 剩 320 GB'],
    parts: { worker: { name: '求解 worker', yes: '在跑', no: '没在跑', about: '没在跑时，排好队的行没人算。启动和停都要你说。', on: '启动 worker', off: '优雅停（算完手上的再停）' } } }
};
const front = b => 6 + 2.6 * b;        // 编出来的“已知前沿”：去骨量 → F

/* 一个包 = 一份说明（下面这些字段）+ 计算（这里是假的：calc 编出结果）+ 结果展示（calc 里画的图）。
   steps 的 kind：auto 自动走（min 是虚拟分钟，on 是它要哪台机器的哪一样开着）；you 要你点一下；
                 rows 一批行在两台机器之间排队求解；judge 照封存的判据判定；note 你写一句结论收尾。 */
const PACKAGES = [
{ id: 'intake', kind: '重建', name: '接一根新骨',
  about: '把一根新股骨接进来：读几何、定头心和颈轴、你核对、注册股骨键，再用候选池在这根骨上做一遍可行图。不算有限元。照《新股骨的统一流程》第 0、1 步。',
  needs: [{ key: 'geom', type: '几何', label: '骨的几何文件' }],
  settings: [
    { key: 'name', name: '新骨的名字', group: '这根骨', kind: '文字', def: '第二根骨' },
    { key: 'side', name: '侧别', group: '这根骨', kind: '选项', choices: ['右', '左'], def: '右' },
    { key: 'core', name: '松质芯', group: '这根骨', kind: '选项', choices: ['空芯', '实芯'], def: '空芯', about: '3406 用的是空芯假设' },
    { key: 'pool', name: '候选池大小', group: '可行图', kind: '选项', choices: ['16384', '65536'], def: '16384', unit: '点' }],
  gates: [
    { id: '骨1', text: '颈轴和标志点核对一致', metric: 'axis_dev', name: '颈轴偏差', op: '<=', value: 0.5, unit: '°' },
    { id: '骨2', text: '可行的设计点够多', metric: 'feasible', name: '可行点个数', op: '>=', value: 1000, unit: '个' }],
  steps: [
    { name: '读几何，定头心和颈轴', who: '包', kind: 'auto', min: 6, note: '在本机算' },
    { name: '核对标志点', who: '你', kind: 'you', say: '标志点没问题', note: '头心、颈轴、侧别对不对，要人看一眼' },
    { name: '注册股骨键', who: '平台', kind: 'auto', min: 1, note: '骨的文件一改就要换键' },
    { name: '可行图', who: '包', kind: 'auto', min: 35, on: 'linux.serve', note: '候选池在这根骨上逐个试放，算去骨量和 F' },
    { name: '判定', who: '平台', kind: 'judge' }],
  calc(x) {
    const r = rng(x.id * 31 + 5), big = x.settings.pool === '65536';
    const rep = { axis_dev: +(0.08 + 0.55 * r()).toFixed(2), feasible: Math.round((1500 + 1100 * r()) * (big ? 4 : 1)) };
    const pts = Array.from({ length: 70 }, () => { const L = 20 + 25 * r(); return [L, 3.5 + 0.12 * L + 2.5 * r()]; });
    return { rep, figs: [plot({ title: '可行图：放得进去的设计', x: '柄长 L (mm)', y: '去骨量 (cm³)', series: [{ name: '可行的点（抽 70 个画）', pts }] })],
      outs: [{ type: '骨', name: x.settings.name, note: `${x.settings.side}侧，${x.settings.core}；新的股骨键` },
             { type: '候选池', name: `${x.settings.name}的 ${x.settings.pool} 点池`, note: `可行 ${rep.feasible} 个` }] };
  } },

{ id: 'fe', kind: 'FEA', name: 'FE 批次', hasRows: true,
  about: '一批行（设计点 × 条件）在冻结模型上算有限元。照 experiments/ 的做法：提议、判据先写、你批准、喂料、两台机器排队求解、导出进数据库、判定、记一笔。',
  needs: [{ key: 'bone', type: '骨', label: '哪根骨' }, { key: 'model', type: '冻结模型', label: '哪个冻结模型' }, { key: 'rows', type: '行', label: '哪批行' }],
  settings: [
    { key: 'why', name: '目的', group: '提议', kind: '文字', def: '' , about: '一句话：这一批要回答什么' },
    { key: 'd', name: '绑定的交付物', group: '提议', kind: '文字', def: 'D7' },
    { key: 'hours', name: '槽时上限', group: '提议', kind: '数', def: 20, min: 0.5, max: 200, unit: '槽时', about: '超了只提醒，不拦' },
    { key: 'review', name: '要第二个模型审查', group: '提议', kind: '开关', def: true },
    { key: 'load', name: '载荷', group: '条件', kind: '选项', choices: ['楼梯 2391 N', '坐起 1714 N', 'F3839'], def: '楼梯 2391 N' },
    { key: 'mesh', name: '网格 h', group: '条件', kind: '选项', choices: ['2.0', '1.94', '2.06', '1.4（重作业）'], def: '2.0', unit: 'mm' },
    { key: 'mu', name: '摩擦 μ', group: '条件', kind: '数', def: 0.3, min: 0.1, max: 0.6 },
    { key: 'delta', name: '过盈 δ', group: '条件', kind: '数', def: 0.10, min: 0, max: 0.3, unit: 'mm' },
    { key: 'cycles', name: '循环数', group: '条件', kind: '整数', def: 2, min: 1, max: 5 },
    { key: 'slow', name: '慢启动', group: '排队', kind: '整数', def: 2, min: 1, max: 6, unit: '行', about: '头几行算完，才把后面的放进队列' },
    { key: 'cap', name: '没人领的行最多', group: '排队', kind: '整数', def: 6, min: 1, max: 12, unit: '行' }],
  gates: [
    { id: 'G56', text: '每一行的转动都不超过相同去骨量下 A 族的 1.10 倍', metric: 'rot_ratio', name: '转动最大的一行是 A 族的', op: '<=', value: 1.10, unit: '倍', naIfFailed: true },
    { id: 'G57', text: '算完的行不少于九成', metric: 'ok_frac', name: '算完的比例', op: '>=', value: 0.9, unit: '' },
    { id: 'G58', text: '至少 2 行明显好过已知的前沿', metric: 'better', name: '好过前沿的行', op: '>=', value: 2, unit: '行' }],
  steps: [
    { name: '提议', who: '平台', kind: 'auto', min: 2, note: '照你填的写出提议：目的、行数、槽时估计' },
    { name: '审查', who: '另一个模型', kind: 'auto', min: 8, optional: 'review', note: '只读审查包；高严重度的问题没关掉不能批准' },
    { name: '批准', who: '你', kind: 'you', say: '批准这一批', note: '批准以后，判据和行就冻结了' },
    { name: '部署到 Linux', who: '你', kind: 'you', say: '可以写 Linux', note: '往 Linux 写文件要你明说，一次授权不沿用' },
    { name: '喂料、排队、求解', who: '两台机器', kind: 'rows', note: 'Linux 做前处理和后处理，本机 3 个槽求解' },
    { name: '导出进数据库', who: '平台', kind: 'auto', min: 15, on: 'linux.serve', note: '拉回结果，做成数据库的新一版，过一遍 QA' },
    { name: '判定', who: '平台', kind: 'judge' },
    { name: '记一笔', who: '你', kind: 'note', say: '写下结论，收尾', note: '喂料时间、异常、判定后的结论；只追加' }],
  rows(x) {
    const m = libOf(x.inputs.rows) || {}, r = rng(x.id * 7919 + 13), heavy = String(x.settings.mesh).startsWith('1.4');
    return Array.from({ length: m.n || 4 }, (_, i) => {
      const u = r(), fate = u < 0.03 ? 'DESIGN' : u < (heavy ? 0.15 : 0.09) ? 'NUMERIC' : u < (heavy ? 0.21 : 0.15) ? 'ENV' : 'OK', bone = 4 + 5 * r();
      return { i: i + 1, name: `${m.tag || 'row'}_${String(i + 1).padStart(2, '0')}`, st: '没喂', t: 0, fate, retry: 0, need: (35 + 50 * r()) * (heavy ? 3 : 1),
        bone: +bone.toFixed(2), F: +(front(bone) + (r() - 0.55) * 6).toFixed(1),
        rot: +(0.9 + 0.24 * r() + (x.settings.load === '坐起 1714 N' ? 0.02 : 0)).toFixed(3),
        mm: Math.round(Math.exp(Math.log(60) + (r() - 0.5) * 1.2) * (0.3 / x.settings.mu)) };
    });
  },
  calc(x) {
    const ok = x.rows.filter(r => r.klass === 'OK'), failed = x.rows.filter(r => r.st === 'FAILED').length;
    const rep = { rot_ratio: ok.length ? Math.max(...ok.map(r => r.rot)) : null, ok_frac: x.rows.length ? +(ok.length / x.rows.length).toFixed(2) : 0,
      better: ok.filter(r => r.F > front(r.bone) + 1).length, _failed: failed };
    const figs = !ok.length ? [] : [
      plot({ title: 'F 对去骨量：这一批的行和已知的前沿', x: '去骨量 (cm³)', y: 'F (mm)',
        series: [{ name: '这一批的行', pts: ok.map(r => [r.bone, r.F]) }, { name: '已知的前沿', line: true, dash: true, pts: [[4, front(4)], [9, front(9)]] }] }),
      plot({ title: '每一行的转动（是 A 族的几倍）', x: '行的序号', y: '倍数', series: [{ name: '转动', pts: ok.map(r => [r.i, r.rot]) }], hlines: [{ y: 1.10, name: '界限 1.10' }] })];
    const n = state.lib.filter(m => m.type === '数据库').length;
    return { rep, figs, outs: [{ type: '数据库', name: `db3406 v0.${14 + n}`, note: `加进了这一批的 ${ok.length} 行；还没发布` }] };
  } },

{ id: 'gp', kind: '代理', name: '标量代理（GP）',
  about: '在数据库的一个版本上训练标量代理：先冻结留出集，在本机 CPU 上训练，再报留出误差和覆盖。',
  needs: [{ key: 'db', type: '数据库', label: '用哪一版数据库训练' }],
  settings: [
    { key: 'target', name: '要预测的量', group: '数据', kind: '选项', choices: ['log 微动', 'F', '转动'], def: 'log 微动' },
    { key: 'holdout', name: '留出比例', group: '数据', kind: '数', def: 0.2, min: 0.1, max: 0.4, about: '这么多行不参与训练，只用来算误差' },
    { key: 'kernel', name: '核', group: '训练', kind: '选项', choices: ['Matérn 5/2', 'RBF'], def: 'Matérn 5/2' },
    { key: 'seed', name: '随机种子', group: '训练', kind: '整数', def: 1, min: 0, max: 9999 }],
  gates: [
    { id: '代1', text: '留出误差够小', metric: 'rmse', name: '留出 RMSE', op: '<=', value: 0.06, unit: 'dex' },
    { id: '代2', text: '预测区间盖得住', metric: 'cover', name: '覆盖', op: '>=', value: 0.90, unit: '' }],
  steps: [
    { name: '冻结留出集', who: '平台', kind: 'auto', min: 1, note: '留出的行先定死，不进训练，不进选点' },
    { name: '训练', who: '包', kind: 'auto', min: 25, note: '本机 CPU' },
    { name: '算留出误差和覆盖', who: '包', kind: 'auto', min: 5 },
    { name: '判定', who: '平台', kind: 'judge' }],
  calc(x) {
    const r = rng(x.id * 53 + x.settings.seed), S = x.settings;
    const rmse = +((0.043 + (0.2 - S.holdout) * 0.03 + (r() - 0.5) * 0.03) * (S.target === 'F' ? 0.8 : 1) * (S.kernel === 'RBF' ? 1.15 : 1)).toFixed(3);
    const rep = { rmse, cover: +(0.93 - (rmse - 0.043) * 2 + (r() - 0.5) * 0.04).toFixed(2) };
    const pts = Array.from({ length: 40 }, () => { const t = 1.2 + 1.3 * r(); return [t, t + (r() - 0.5) * rmse * 5]; });
    return { rep, figs: [
      plot({ title: `留出的行：预测对真值（${S.target}）`, x: '真值', y: '预测', series: [{ name: '留出的行', pts }, { name: '预测 = 真值', line: true, dash: true, pts: [[1.2, 1.2], [2.5, 2.5]] }] }),
      plot({ title: '训练的行越多，误差越小', x: '训练用的行数', y: '留出 RMSE (dex)', series: [{ name: '留出 RMSE', line: true, pts: [200, 400, 600, 800, 1000, 1150].map((n, i) => [n, rmse * (1 + 1.6 * Math.exp(-i * 0.8))]) }] })],
      outs: [{ type: '代理', name: `标量代理 GP（${S.target}）`, note: `留出 RMSE ${rmse} dex，覆盖 ${rep.cover}` }] };
  } },

{ id: 'field', kind: '代理', name: '场网络',
  about: '在 Linux 的 GPU 上训练预测整张场的网络。训练数据在 NVMe 盘上，盘没挂上就走不动。',
  needs: [{ key: 'db', type: '数据库', label: '用哪一版数据库训练' }],
  settings: [
    { key: 'net', name: '哪种网络', group: '训练', kind: '选项', choices: ['场', '图', '体素'], def: '场' },
    { key: 'epochs', name: '轮数', group: '训练', kind: '整数', def: 300, min: 10, max: 2000 },
    { key: 'batch', name: '批大小', group: '训练', kind: '整数', def: 16, min: 1, max: 64 }],
  gates: [{ id: '场1', text: '场的误差够小', metric: 'ferr', name: '场误差', op: '<=', value: 15, unit: '%' }],
  steps: [
    { name: '冻结留出集', who: '平台', kind: 'auto', min: 1 },
    { name: '训练', who: '包', kind: 'auto', min: 180, on: 'linux.nvme', note: 'Linux 的 GPU；数据在 NVMe 上' },
    { name: '算场误差', who: '包', kind: 'auto', min: 10, on: 'linux.nvme' },
    { name: '判定', who: '平台', kind: 'judge' }],
  calc(x) {
    const r = rng(x.id * 71 + 3), S = x.settings, ferr = +(9 + 9 * r() + 600 / S.epochs).toFixed(1);
    return { rep: { ferr }, figs: [plot({ title: '训练曲线', x: '轮数', y: '损失', series: [
      { name: '训练', line: true, pts: Array.from({ length: 12 }, (_, i) => [i * S.epochs / 11, 0.1 + Math.exp(-i * 0.5)]) },
      { name: '留出', line: true, dash: true, pts: Array.from({ length: 12 }, (_, i) => [i * S.epochs / 11, 0.18 + Math.exp(-i * 0.45)]) }] })],
      outs: [{ type: '代理', name: `${S.net}网络`, note: `场误差 ${ferr}%` }] };
  } },

{ id: 'al', kind: '优化', name: '主动学习选点',
  about: '代理给整个候选池打分，按配比选出下一批要算的行。它只出一批行，放进库里；要不要拿去开 FE 批次，由你定。',
  needs: [{ key: 'sur', type: '代理', label: '用哪个代理' }, { key: 'pool', type: '候选池', label: '在哪个候选池里选' }, { key: 'db', type: '数据库', label: '已经算过的行看哪一版' }],
  settings: [

/* ════════ 三、引擎：虚拟的钟每走一下，各个实验往前挪一点 ════════ */
function newExp(d) {
  const p = PK[d.pkg];
  const x = { id: state.next++, pkg: d.pkg, ver: state.ver[d.pkg], kind: p.kind, title: d.title, inputs: d.inputs, settings: d.settings, gates: d.gates,
    step: 0, t: 0, status: '在走', wait: '', made: state.now, from: d.from || null, log: [], rows: null };
  if (p.rows) x.rows = p.rows(x);
  state.exps.push(x);
  logE(`封存 ${eid(x)}「${x.title}」：${p.name} 第 ${x.ver} 版`);
  skip(x);
  return x;
}
const skipped = (x, st) => st.optional && !x.settings[st.optional];
function skip(x) { const steps = PK[x.pkg].steps; while (x.step < steps.length && skipped(x, steps[x.step])) x.step++; }
function next(x) {
  const steps = PK[x.pkg].steps;
  x.log.push(`${fmtT(state.now)} 走完“${steps[x.step].name}”`);
  x.step++; x.t = 0; skip(x);
  if (x.step >= steps.length) {
    x.status = '完成'; x.done = state.now; x.wait = '';
    const outs = PK[x.pkg].calc(x).outs || [];
    outs.forEach(o => addLib({ ...o, from: `${eid(x)}「${x.title}」的产出`, exp: x.id }));
    logE(`${eid(x)}「${x.title}」完成：${verdictText(x)}${outs.length ? '；产出 ' + outs.map(o => o.type + '「' + o.name + '」').join('、') + ' 进了库' : ''}`);
  }
}
function judge(x) {
  const rep = PK[x.pkg].calc(x).rep, cmp = { '<=': (a, b) => a <= b, '>=': (a, b) => a >= b, '<': (a, b) => a < b, '>': (a, b) => a > b };
  x.reports = rep;
  x.verdict = x.gates.filter(g => g.use !== false).map(g => {
    const v = rep[g.metric];
    let st = v === null || v === undefined ? 'NA' : cmp[g.op](v, g.value) ? 'PASS' : 'FAIL';
    if (st === 'PASS' && g.naIfFailed && rep._failed) st = 'NA';      // 没有超过的，但有行没算出来：不适用，不判过
    return { id: g.id, text: g.text, name: g.name, op: g.op, value: g.value, unit: g.unit, actual: v, status: st };
  });
}
const verdictText = x => !x.verdict ? '还没判定' : !x.verdict.length ? '没写判据' : x.verdict.map(v => `${v.id} ${v.status}`).join('，');
function fail(x, r, klass, why) { r.st = 'FAILED'; r.klass = klass; r.why = why; x.log.push(`${fmtT(state.now)} ${r.name} 没算成：${why}`); }
function stepRows(x, dt) {
  const S = x.settings, rows = x.rows, serve = state.m.linux.serve === true, worker = state.m.win.worker === true;
  const ended = rows.filter(r => r.st === 'DONE' || r.st === 'FAILED').length;
  let waiting = rows.filter(r => ['NEW', '前处理', 'READY'].includes(r.st)).length, fed = rows.filter(r => r.st !== '没喂').length;
  for (const r of rows) {                                   // 喂料：慢启动，没人领的不能太多
    if (r.st !== '没喂') continue;
    if (waiting >= S.cap || (ended < S.slow && fed >= S.slow)) break;
    r.st = 'NEW'; waiting++; fed++;
    if (fed === 1) x.log.push(`${fmtT(state.now)} 开始喂料`);
  }
  if (serve) {                                              // Linux 上前处理，最多 2 行一起
    let prep = allRows().filter(r => r.st === '前处理').length;
    for (const r of rows) if (r.st === 'NEW' && prep < 2) { r.st = '前处理'; r.t = 0; prep++; }
    for (const r of rows) if (r.st === '前处理' && (r.t += dt) >= 4) {
      if (r.fate === 'DESIGN') fail(x, r, 'DESIGN', '设计在这根骨上放不进去'); else { r.st = 'READY'; r.t = 0; }
    }
  }
  if (worker) {                                             // 本机 worker 领行，3 个槽所有实验合用
    let busy = allRows().filter(r => r.st === '在算').length;
    for (const r of rows) if (r.st === 'READY' && busy < SLOTS) { r.st = '在算'; r.t = 0; busy++; }
  }
  for (const r of rows) if (r.st === '在算' && (r.t += dt) >= r.need) {
    if (r.fate === 'ENV' && r.retry < 1) { r.retry++; r.fate = 'OK'; r.st = 'READY'; r.t = 0; x.log.push(`${fmtT(state.now)} ${r.name} 许可没取到，放回队列`); }
    else if (r.fate === 'NUMERIC') fail(x, r, 'NUMERIC', '求解在数值上没算出来');
    else { r.st = '后处理'; r.t = 0; }
  }
  if (serve) for (const r of rows) if (r.st === '后处理' && (r.t += dt) >= 2) { r.st = 'DONE'; r.klass = 'OK'; x.log.push(`${fmtT(state.now)} ${r.name} 算完`); }
  x.wait = rows.some(r => r.st === 'READY') && !worker && !rows.some(r => r.st === '在算') ? 'worker 没在跑，排好队的行没人算'
    : !serve && rows.some(r => ['NEW', '前处理', '后处理'].includes(r.st)) ? 'serve 没在跑' : '';
  if (rows.every(r => r.st === 'DONE' || r.st === 'FAILED')) next(x);
}
function advance(dt) {
  state.now += dt * 60000;
  if (state.m.win.worker === 'stopping' && !allRows().some(r => r.st === '在算')) { state.m.win.worker = false; logE('worker 算完手上的行，停了'); }
  for (const x of state.exps) {
    if (x.status !== '在走' || x.paused) continue;
    const st = PK[x.pkg].steps[x.step];
    if (st.kind === 'you' || st.kind === 'note') { x.wait = '你：' + st.say; continue; }
    if (st.kind === 'judge') { judge(x); next(x); continue; }
    if (st.kind === 'rows') { stepRows(x, dt); continue; }
    if (st.on && !partOn(st.on)) { x.wait = partName(st.on) + ' 没开'; continue; }
    x.wait = ''; x.t += dt;
    if (x.t >= st.min) next(x);
  }
}
function tick() {

}

/* ════════ 四、图：包画的图，这里统一用一个小函数画成 SVG ════════ */
function plot(o) {
  const W = 540, H = 320, L = 60, R = 16, T = 30, B = 44, xs = [], ys = [];
  o.series.forEach(s => s.pts.forEach(p => { xs.push(p[0]); ys.push(p[1]); }));
  (o.hlines || []).forEach(h => ys.push(h.y));
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  const py = (y1 - y0) * 0.1 || 1; y0 -= py; y1 += py;
  const X = v => (L + (v - x0) / (x1 - x0) * (W - L - R)).toFixed(1), Y = v => (H - B - (v - y0) / (y1 - y0) * (H - T - B)).toFixed(1);
  const f = v => Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-size="12" font-family="Microsoft YaHei,sans-serif"><rect width="${W}" height="${H}" fill="#fff"/><text x="${W / 2}" y="19" text-anchor="middle" font-size="14">${esc(o.title)}</text>`;
  for (let i = 0; i <= 4; i++) {
    const gx = x0 + (x1 - x0) * i / 4, gy = y0 + (y1 - y0) * i / 4;
    s += `<line x1="${X(gx)}" y1="${T}" x2="${X(gx)}" y2="${H - B}" stroke="#eee"/><text x="${X(gx)}" y="${H - B + 15}" text-anchor="middle">${f(gx)}</text>`
       + `<line x1="${L}" y1="${Y(gy)}" x2="${W - R}" y2="${Y(gy)}" stroke="#eee"/><text x="${L - 5}" y="${+Y(gy) + 4}" text-anchor="end">${f(gy)}</text>`;
  }
  s += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="none" stroke="#999"/><text x="${(L + W - R) / 2}" y="${H - 9}" text-anchor="middle">${esc(o.x)}</text>`
     + `<text x="14" y="${(T + H - B) / 2}" text-anchor="middle" transform="rotate(-90 14 ${(T + H - B) / 2})">${esc(o.y)}</text>`;
  const C = ['#2367c7', '#d1495b', '#3b8b4b', '#8a5cc2'], lg = [];
  o.series.forEach((se, i) => {
    const c = C[i % 4];
    s += se.line ? `<polyline fill="none" stroke="${c}" stroke-width="2"${se.dash ? ' stroke-dasharray="6 4"' : ''} points="${se.pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>`
                 : se.pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${c}" fill-opacity="0.85"/>`).join('');
    lg.push([se.name, c]);
  });
  (o.hlines || []).forEach(h => { s += `<line x1="${L}" y1="${Y(h.y)}" x2="${W - R}" y2="${Y(h.y)}" stroke="#b9770e" stroke-width="1.5" stroke-dasharray="6 4"/>`; lg.push([h.name, '#b9770e']); });
  lg.forEach((l, i) => { s += `<rect x="${L + 8}" y="${T + 6 + i * 16}" width="10" height="10" fill="${l[1]}"/><text x="${L + 23}" y="${T + 15 + i * 16}" paint-order="stroke" stroke="#fff" stroke-width="3">${esc(l[0])}</text>`; });
  return s + '</svg>';
}

  const list = ASSUME[name] || [], n = state.notes.length + Object.values(state.rej).filter(v => v.on).length;
  return `<div class="card"><h3 style="margin-top:2px">这一屏上我先取的</h3><p class="mut">这些不是你定的。不对的勾一下，能写一句应该怎样更好。</p><ul>${list.length ? list.map((t, i) => { const k = name + ':' + i, r = state.rej[k] || {};
    return `<li><label><input type="checkbox" data-rej="${k}"${r.on ? ' checked' : ''}> <span class="${r.on ? 'rej' : ''}">${r.on ? '不对：' : ''}${esc(t)}</span></label>${r.on ? `<input type="text" data-rejtxt="${k}" value="${esc(r.txt || '')}" placeholder="应该怎样">` : ''}</li>`; }).join('') : '<li class="mut">这一屏没有列。</li>'}</ul>
  <h3>记一笔</h3><textarea id="note" placeholder="在这一屏上发现的问题：哪里别扭、缺什么、哪句话看不懂……"></textarea><button data-do="note">记下</button>
  <p class="mut">已经记了 ${n} 条。<a href="#/issues">看问题清单</a></p></div>`;
}
function render(full = true) {
  const r = route();
  if (r.name === 'new' && full) startDraft(r.q);
  const html = { dash: vDash, m: vMachines, exps: vExps, exp: () => vExp(r.id), new: vNew, lib: vLib, log: vLog, issues: vIssues }[r.name]();
  if (full || html !== lastHtml) { view.innerHTML = html; lastHtml = html; }   // 没变就不重画
  if (full) {
    side.innerHTML = r.name === 'issues' ? '' : vSide(r.name);
    document.getElementById('nav').innerHTML = NAV.map(n => `<a href="#/${n[0]}"${n[2] === r.name || (r.name === 'exp' && n[2] === 'exps') ? ' class="here"' : ''}>${n[1]}</a>`).join(' ');
    document.getElementById('speeds').innerHTML = [[0, '暂停'], [1, '1 秒 = 1 分钟'], [10, '1 秒 = 10 分钟'], [60, '1 秒 = 1 小时']].map(s => `<button data-do="speed" data-v="${s[0]}"${state.speed === s[0] ? ' class="on"' : ''}>${s[1]}</button>`).join('');
    flash = '';
  }
}

/* ════════ 六、点和填 ════════ */
const DO = {
  speed(el) { state.speed = +el.dataset.v; save(); render(); },
  part(el) {
    const { m, p, v } = el.dataset, P = MACHINES[m].parts[p];
    if (v === 'on') { state.m[m][p] = true; logE(`你说：${P.on}`); }
    else if (p === 'worker') { state.m[m][p] = 'stopping'; logE(`你说：${P.off}`); }
    else { state.m[m][p] = false; logE(`你说：${P.off}`); }
    save(); render();
  },
  yes(el) {
    const x = expOf(el.dataset.id), st = stepOf(x);
    if (st.kind === 'note') { x.note = (document.getElementById('concl') || {}).value || '（没写）'; logE(`${eid(x)}「${x.title}」记下结论：${x.note}`); }
    else logE(`你说：${st.say}（${eid(x)}「${x.title}」）`);
    x.log.push(`${fmtT(state.now)} 你说：${st.say}`);
    next(x); save(); render();
  },
  pause(el) { const x = expOf(el.dataset.id); x.paused = !x.paused; logE(`你${x.paused ? '停下' : '继续'}了 ${eid(x)}「${x.title}」`); save(); render(); },
  seal() {
    const d = draft, p = PK[d.pkg], errs = [];
    for (const n of p.needs) if (!d.inputs[n.key]) errs.push(`「${n.label}」还没选`);
    const settings = {};
    for (const s of p.settings) {
      let v = d.settings[s.key];
      if (s.kind === '数' || s.kind === '整数') {
        v = Number(v);
        if (!Number.isFinite(v) || (s.kind === '整数' && !Number.isInteger(v))) errs.push(`「${s.name}」要填一个${s.kind}`);
        else if (v < s.min || v > s.max) errs.push(`「${s.name}」= ${v}，超出了范围（${s.min} ~ ${s.max}）`);
      }
      settings[s.key] = v;
    }
    const gates = d.gates.map(g => ({ ...g, value: Number(g.value) }));
    gates.forEach(g => { if (g.use !== false && !Number.isFinite(g.value)) errs.push(`判据 ${g.id} 的界限要填一个数`); });
    if (errs.length) { flash = errs.map(e => `<div class="err">${esc(e)}</div>`).join(''); render(false); flash = ''; window.scrollTo(0, 0); return; }
    const x = newExp({ pkg: p.id, title: (d.title || '').trim() || `${p.name} ${fmtT(state.now)}`, inputs: Object.fromEntries(Object.entries(d.inputs).map(([k, v]) => [k, +v])), settings, gates, from: d.from });
    draft = null; save(); location.hash = '#/exp/' + x.id;
  },
  bump(el) { const p = PK[el.dataset.p]; state.ver[p.id]++; logE(`包「${p.name}」登记成第 ${state.ver[p.id]} 版`); flash = `<div class="note">「${p.name}」现在是第 ${state.ver[p.id]} 版。以前的实验还记着它们当时的那一版。</div>`; save(); render(); },
  reg() {
    const t = document.getElementById('lt').value.trim(), n = document.getElementById('ln').value.trim(), o = document.getElementById('lo').value.trim();
    if (!t || !n) { flash = '<div class="err">类型和名字都要写。</div>'; render(); return; }
    addLib({ type: t, name: n, note: o, ...(t === '行' ? { n: 6, tag: 'row' } : {}) }); logE(`登记了外来的${t}「${n}」`); flash = `<div class="note">登记好了：${esc(t)}「${esc(n)}」。</div>`; save(); render();
  },
  note() {
    const el = document.getElementById('note'), text = el.value.trim(); if (!text) return;
    const r = route(), x = r.name === 'exp' && expOf(r.id);
    state.notes.push({ t: Date.now(), where: screenName(r.name) + (x ? `：${x.title}，${whereNow(x)}` : r.name === 'new' && draft && draft.pkg ? `：${PK[draft.pkg].name}` : ''), text });
    save(); side.innerHTML = vSide(r.name);
  },
  selall() { const t = document.getElementById('exp-txt'); t.focus(); t.select(); },
  clearnotes() { if (confirm('把你记的和标成“不对”的都清空？')) { state.notes = []; state.rej = {}; save(); render(); } },
  reset() { if (confirm('把虚拟世界恢复成最开始的样子？你记的问题不动。')) { const keep = [state.notes, state.rej]; fresh(); [state.notes, state.rej] = keep; save(); location.hash = '#/'; render(); } }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-do]'); if (el) DO[el.dataset.do](el); });
document.addEventListener('change', e => {
  const t = e.target, r = route();
  if (t.dataset.rej) { const k = t.dataset.rej; state.rej[k] = { ...(state.rej[k] || {}), on: t.checked }; save(); side.innerHTML = vSide(r.name); return; }
  if (t.dataset.rejtxt) { state.rej[t.dataset.rejtxt].txt = t.value; save(); return; }
  if (!draft) return;
  if (t.dataset.in) draft.inputs[t.dataset.in] = t.value;
  if (t.dataset.set) draft.settings[t.dataset.set] = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.gate) draft.gates[t.dataset.gate][t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
  if ('title' in t.dataset) draft.title = t.value;
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
load(); render(); setInterval(tick, 500);
</script>
</body>
</html>
